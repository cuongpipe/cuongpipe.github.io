<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Wi-Mesh Status Dashboard</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; }
    .card { background: #1e293b; border-radius: 8px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; background: #059669; }
    .score { font-size: 20px; font-weight: bold; color: #38bdf8; }
    .meta { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <h2>Wi-Mesh Check-in Monitor</h2>
  <div id="meta" class="meta">Đang tải...</div>
  <div id="accounts"></div>

  <script>
    async function loadStatus() {
      // Thay URL tương ứng hoặc qua reverse proxy nếu dính CORS
      const res = await fetch('https://wi-mesh.onrender.com/status');
      const data = await res.json();
      
      document.getElementById('meta').innerHTML = `Lần chạy gần nhất: ${data.last_run} | Lần chạy tiếp theo: ${data.next_run}`;
      
      const container = document.getElementById('accounts');
      container.innerHTML = Object.values(data.accounts_status).map(acc => `
        <div class="card">
          <div>
            <strong>${acc.user_name}</strong>
            <div style="font-size: 12px; color: #94a3b8;">Kiểm tra lúc: ${acc.last_checked}</div>
          </div>
          <div style="text-align: right;">
            <div class="score">${acc.score} pts</div>
            <span class="badge">${acc.status}</span>
          </div>
        </div>
      `).join('');
    }
    loadStatus();
    setInterval(loadStatus, 60000); // Tự động làm mới mỗi 1 phút
  </script>
</body>
</html>
