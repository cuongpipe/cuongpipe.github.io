<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wi-Mesh Status Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Header -->
    <div class="flex flex-wrap items-center justify-between gap-4 pb-4 border-b border-slate-700">
      <div>
        <h1 class="text-2xl font-bold text-emerald-400">Wi-Mesh Auto Check-in Dashboard</h1>
        <p class="text-sm text-slate-400" id="conn-status">Đang kết nối...</p>
      </div>
      <button onclick="fetchStatus()" id="reload-btn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-sm font-semibold transition">
        Làm mới
      </button>
    </div>

    <!-- Overview Cards -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <div class="text-xs text-slate-400">Lần chạy trước</div>
        <div id="last-run" class="text-sm font-mono text-slate-200 mt-1">--</div>
      </div>
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <div class="text-xs text-slate-400">Lần chạy kế tiếp</div>
        <div id="next-run" class="text-sm font-mono text-emerald-400 mt-1">--</div>
      </div>
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <div class="text-xs text-slate-400">Tổng tài khoản</div>
        <div id="acc-count" class="text-xl font-bold text-slate-200 mt-1">--</div>
      </div>
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <div class="text-xs text-slate-400">Tổng điểm</div>
        <div id="total-score" class="text-xl font-bold text-amber-400 mt-1">--</div>
      </div>
    </div>

    <!-- Accounts Status -->
    <div>
      <h2 class="text-lg font-semibold mb-3 text-slate-300">Danh sách tài khoản</h2>
      <div id="accounts-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Rendered by JS -->
      </div>
    </div>

    <!-- Logs -->
    <div>
      <h2 class="text-lg font-semibold mb-3 text-slate-300">Nhật ký (Recent Logs)</h2>
      <div id="logs" class="bg-black/60 font-mono text-xs text-slate-300 p-4 rounded-xl border border-slate-800 h-64 overflow-y-auto space-y-1">
        <!-- Rendered by JS -->
      </div>
    </div>

  </div>

  <script>
    const DIRECT_URL = "https://wi-mesh.onrender.com/status";
    const PROXY_URL = "https://corsproxy.io/?" + encodeURIComponent(DIRECT_URL);

    async function fetchStatus() {
      const connStatus = document.getElementById("conn-status");
      const reloadBtn = document.getElementById("reload-btn");
      
      connStatus.innerText = "Đang tải dữ liệu (Server có thể mất 30-50s nếu đang thức giấc)...";
      connStatus.className = "text-sm text-amber-400";
      reloadBtn.disabled = true;
      reloadBtn.classList.add("opacity-50");

      let data = null;

      // 1. Thử gọi trực tiếp
      try {
        const res = await fetch(DIRECT_URL, { signal: AbortSignal.timeout(60000) });
        if (res.ok) data = await res.json();
      } catch (err) {
        console.warn("Direct fetch thất bại, chuyển sang Proxy...", err);
      }

      // 2. Nếu direct lỗi (thường do CORS), thử qua CORS Proxy
      if (!data) {
        try {
          const res = await fetch(PROXY_URL, { signal: AbortSignal.timeout(60000) });
          if (res.ok) data = await res.json();
        } catch (err) {
          console.error("Proxy fetch thất bại", err);
        }
      }

      reloadBtn.disabled = false;
      reloadBtn.classList.remove("opacity-50");

      if (data) {
        connStatus.innerText = "Trực tuyến • Đã cập nhật";
        connStatus.className = "text-sm text-emerald-400";
        renderData(data);
      } else {
        connStatus.innerText = "Không thể lấy dữ liệu (Server ngủ quá lâu hoặc proxy bận). Thử lại sau.";
        connStatus.className = "text-sm text-rose-400";
      }
    }

    function renderData(data) {
      document.getElementById("last-run").innerText = data.last_run || "--";
      document.getElementById("next-run").innerText = data.next_run || "--";

      const accounts = data.accounts_status || {};
      const accKeys = Object.keys(accounts);
      document.getElementById("acc-count").innerText = accKeys.length;

      let totalScore = 0;
      const accListEl = document.getElementById("accounts-list");
      accListEl.innerHTML = "";

      accKeys.forEach(key => {
        const item = accounts[key];
        totalScore += item.score || 0;

        const card = document.createElement("div");
        card.className = "bg-slate-800 border border-slate-700 rounded-xl p-4 flex justify-between items-center";
        card.innerHTML = `
          <div>
            <div class="font-bold text-slate-100 text-base">${item.user_name}</div>
            <div class="text-xs text-slate-400 mt-1">${item.status}</div>
            <div class="text-[10px] text-slate-500 font-mono mt-1">${item.last_checked}</div>
          </div>
          <div class="text-right">
            <span class="inline-block bg-amber-400/10 text-amber-400 border border-amber-400/20 px-3 py-1 rounded-full font-bold text-sm">
              ${item.score} đ
            </span>
          </div>
        `;
        accListEl.appendChild(card);
      });

      document.getElementById("total-score").innerText = totalScore;

      // Logs
      const logsEl = document.getElementById("logs");
      logsEl.innerHTML = "";
      (data.recent_logs || []).forEach(log => {
        const line = document.createElement("div");
        line.innerText = log;
        logsEl.appendChild(line);
      });
      logsEl.scrollTop = logsEl.scrollHeight;
    }

    // Tự chạy lần đầu
    fetchStatus();
  </script>
</body>
</html>
